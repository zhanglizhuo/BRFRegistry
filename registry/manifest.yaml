# BRF Benchmark Registry Manifest
# https://github.com/zhanglizhuo/BRFRegistry

version: "2.0"
release_date: "2026-07-04"
total_datasets: 35

description: >
  Curated collection of group-aware benchmark datasets across education,
  engineering, transportation, energy, and other domains with standardized
  metadata, reproducibility scripts, and BRF (Benchmark Reliability Framework)
  audit results.
  35 unique datasets. v2.0 expands from education-only to multi-domain
  (15 new datasets: abalone, airfoil, auto_mpg, bike_sharing, ccpp, concrete,
  energy_building, kaggle_students_performance, kdd_cup_2010, nursery,
  real_estate, seoul_bike, student_absences, student_health, wine_quality).
  All 35 source modules are self-contained (0 external dependencies).

