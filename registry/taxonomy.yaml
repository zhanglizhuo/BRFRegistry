        - OULAD
        - Student Dropout
        - xAPI-Edu
        - Entrance Exam
        - TAE
        - Student Depression
        - PISA 2015

  # ---- Level 3: Grouping Type ----
  grouping_type:
    - institutional:
        - State: Colleges AAUP, Colleges US News, College Scorecard
        - Country: PISA 2015
        - School: UCI Student, UCI Student (Math), Student Absences
        - Course: OULAD, Student Dropout, Higher Ed, Turkiye
        - Qualification: Entrance Exam
        - Module: MathE, OLI, KDD Cup 2010
        - Club: Nursery
    - interpersonal:
        - Instructor: TAE
        - Teacher: ASSISTments
        - Topic: MathE, xAPI-Edu
    - demographic:
        - City: Student Depression
        - Race/Ethnicity: Kaggle Students Performance, Students Exam Scores
        - Cluster: Law School
        - Profession: Student Health
        - Sex: Abalone
        - Origin: Auto MPG
    - engineering:
        - Orientation: Energy Building
        - Frequency: Airfoil
        - Season: Bike Sharing, Seoul Bike
        - Temperature: CCPP
        - Age: Concrete
        - Stores: Real Estate
    - other:
        - Wine Type: Wine Quality
    - none:
        - MM-TBA

  # ---- Level 4: Domain ----
  domain:
    - Learning Analytics: OULAD, xAPI-Edu
    - Academic Performance: Student Dropout, Entrance Exam, UCI Student, UCI Student (Math), Higher Ed, Students Exam Scores
    - Teaching Evaluation: TAE, Turkiye
    - Intelligent Tutoring: ASSISTments, KDD Cup 2010
    - Math Assessment: MathE
    - LLM Evaluation: MM-TBA
    - Engineering Education: OLI
    - Institutional: Colleges AAUP, Colleges US News, College Scorecard
    - Mental Health: Student Depression
    - Legal Education: Law School
    - Large-scale Assessment: PISA 2015
    - Marine Biology: Abalone
    - Aerospace Engineering: Airfoil
    - Automotive: Auto MPG
    - Transportation: Bike Sharing, Seoul Bike
    - Energy: CCPP, Energy Building
    - Civil Engineering: Concrete
    - Real Estate: Real Estate
    - Food Science: Wine Quality
    - Early Childhood: Nursery
    - Student Welfare: Student Absences, Student Health

  # ---- Level 5: Geographic Origin ----
  geography:
    - US: ASSISTments, Colleges AAUP, Colleges US News, College Scorecard, TAE, OLI, Law School, KDD Cup 2010, Auto MPG, Airfoil
    - Europe: OULAD (UK), Student Dropout (Portugal), UCI Student (Portugal), MathE (EU), Turkiye (Turkey), Higher Ed (Turkey), Concrete, Wine Quality
    - Asia: Entrance Exam (India), Student Depression (India), Seoul Bike (S. Korea), Abalone (Tasmania/AU), Nursery
    - International: xAPI-Edu, MM-TBA, PISA 2015, Bike Sharing, CCPP, Energy Building, Real Estate, Kaggle Students Performance, Students Exam Scores, Student Absences, Student Health, UCI Student (Math)
